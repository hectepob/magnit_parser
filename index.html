
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Поиск магазинов Магнит в заданном радиусе">
  <title>Magnit Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Magnit Parser</h1>
      <p>Поиск магазинов Магнит по расстоянию от выбранной точки</p>
    </header>

    <section class="search-panel">
<div class="field">
  <label for="city">Город</label>
  <input type="text" id="city" value="Сочи" readonly>
</div>

<div class="field">
  <label for="storeSearch">Поиск магазина по адресу</label>
  <input
    type="search"
    id="storeSearch"
    placeholder="Начните вводить название улицы"
    autocomplete="off"
  >
</div>

<div class="field">
  <label for="storeSelect">Выбрать магазин</label>
  <select id="storeSelect">
    <option value="">Не выбран</option>
  </select>
</div>

      <div class="field">
        <label for="center">Координаты центра</label>
        <input
          type="text"
          id="center"
          value="43.568674, 39.765322"
          placeholder="Широта, долгота"
        >
      </div>

      <div class="field">
        <label for="radius">Радиус поиска, км</label>
        <input
          type="number"
          id="radius"
          min="0.1"
          max="100"
          step="0.1"
          value="3"
        >
      </div>

      <fieldset class="format-field">
        <legend>Формат магазина</legend>

        <div class="format-options">
          <label class="format-option">
            <input type="checkbox" name="format" value="MM" checked>
            <span>MM</span>
          </label>

          <label class="format-option">
            <input type="checkbox" name="format" value="DG" checked>
            <span>DG</span>
          </label>

          <label class="format-option">
            <input type="checkbox" name="format" value="MA" checked>
            <span>MA</span>
          </label>

          <label class="format-option">
            <input type="checkbox" name="format" value="ME" checked>
            <span>ME</span>
          </label>

          <label class="format-option">
            <input type="checkbox" name="format" value="GM" checked>
            <span>GM</span>
          </label>

          <label class="format-option">
            <input type="checkbox" name="format" value="MC" checked>
            <span>MC</span>
          </label>
        </div>
      </fieldset>

      <button type="button" id="searchButton">
        Найти магазины
      </button>
    </section>

    <section class="status-panel">
      <p id="status" aria-live="polite">
        Укажите параметры поиска и нажмите «Найти магазины».
      </p>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>Найденные магазины</h2>
        <span id="resultsCount">0 магазинов</span>
      </div>

      <div class="brand-field">
        <label for="brand">Искомый бренд</label>
        <input
          type="text"
          id="brand"
          placeholder="Например, Royal"
          autocomplete="off"
        >
      </div>

      <button type="button" id="goodsSearchButton">
        Найти бренд
      </button>

      <p id="goodsStatus" class="goods-status" aria-live="polite"></p>

      <div id="results">
        <p class="empty-state">Здесь появятся найденные магазины.</p>
      </div>
    </section>

    <section class="goods-panel">
      <div class="results-header">
        <h2>Найденные товары</h2>
        <span id="goodsCount">0 товаров</span>
      </div>

      <div id="goodsResults">
        <p class="empty-state">Здесь появятся результаты поиска бренда.</p>
      </div>
    </section>
  </main>

  <script src="geo.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
