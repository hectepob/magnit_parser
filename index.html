
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка API Магнита</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.5;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f1f1f1;
      padding: 12px;
      border-radius: 6px;
    }
    button {
      padding: 12px 18px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h2>Проверка API Магнита</h2>

  <button onclick="checkApi('https://magnit.ru/webgate/v1/stores-facade/search/detail')">
    Проверить API №1
  </button>

  <button onclick="checkApi('https://web-gateway.middle-api.magnit.ru/v2/goods/search')">
    Проверить API №2
  </button>

  <h3>Результат:</h3>
  <pre id="result">Ожидание проверки...</pre>

  <script>
    async function checkApi(url) {
      const result = document.getElementById("result");
      result.textContent = "Отправка запроса:\n" + url;

      try {
        const response = await fetch(url, {
          method: "POST",
          mode: "cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: "{}"
        });

        const body = await response.text();

        result.textContent =
          "HTTP статус: " + response.status +
          "\n\nОтвет сервера:\n" + body;

      } catch (error) {
        result.textContent =
          "ОШИБКА ЗАПРОСА:\n" + error +
          "\n\nПодробности смотри в консоли браузера.";
      }
    }
  </script>
</body>
</html>
