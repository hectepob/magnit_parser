
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Поиск магазинов Магнит в заданном радиусе">
  <title>Magnit Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Magnit Parser</h1>
      <p>Поиск магазинов Магнит по расстоянию от выбранной точки</p>
    </header>

    <section class="search-panel">
      <div class="field">
        <label for="city">Город</label>
        <input
          type="text"
          id="city"
          value="Сочи"
          placeholder="Например, Сочи"
        >
      </div>

      <div class="field">
        <label for="center">Адрес или координаты центра</label>
        <input
          type="text"
          id="center"
          placeholder="Например, 43.5855, 39.7231"
        >
      </div>

      <div class="field">
        <label for="radius">Радиус поиска, км</label>
        <input
          type="number"
          id="radius"
          min="0.1"
          max="100"
          step="0.1"
          value="3"
        >
      </div>

      <button type="button" id="searchButton">
        Найти магазины
      </button>
    </section>

    <section class="status-panel" id="statusPanel" aria-live="polite">
      <p id="status">Укажите центр поиска и нажмите «Найти магазины».</p>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>Результаты</h2>
        <span id="resultsCount">0 магазинов</span>
      </div>

      <div id="results">
        <p class="empty-state">Здесь появятся найденные магазины.</p>
      </div>
    </section>
  </main>

  <script src="geo.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
