name: Magnit API test

on:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search store
        run: |
          curl --compressed -sS --max-time 20 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d '{"filters":{"query":"Сочи, Советская, 42"},"pagination":{"size":10}}'
