
name: Magnit API test

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Check API 1
        run: |
          curl -i -sS --max-time 20 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -d '{}'

      - name: Check API 2
        run: |
          curl -i -sS --max-time 20 \
            -X POST \
            'https://web-gateway.middle-api.magnit.ru/v2/goods/search' \
            -H 'Content-Type: application/json' \
            -d '{}'
            
