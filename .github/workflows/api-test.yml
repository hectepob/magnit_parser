
name: Magnit API test

on:
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test store search
        run: |
          curl -i -sS --max-time 20 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d '{"filters":{"query":"Ясногорская, 4/2"},"pagination":{"size":10}}'
            
