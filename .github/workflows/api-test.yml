name: Magnit goods API test

on:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search Royal Kuchen in target stores
        run: |
          API_HOST='magnit''.'ru
          API_URL="https://${API_HOST}/webgate/v2/goods/search"

          for STORE_CODE in 230487 233561; do
            echo ""
            echo "========================================"
            echo "STORE: $STORE_CODE"
            echo "========================================"

            curl --compressed -sS --max-time 30 \
              -X POST \
              "$API_URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Origin: https://${API_HOST}" \
              -H "Referer: https://${API_HOST}/" \
              -d "{
                \"term\": \"Royal Kuchen\",
                \"pagination\": {
                  \"limit\": 50,
                  \"offset\": 0
                },
                \"sort\": {
                  \"order\": \"desc\",
                  \"type\": \"popularity\"
                },
                \"includeAdultGoods\": true,
                \"storeCode\": \"${STORE_CODE}\",
                \"storeType\": \"1\",
                \"catalogType\": \"1\"
              }" \
              -w '\nHTTP_STATUS:%{http_code}\n'
          done
