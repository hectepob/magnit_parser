
name: Magnit goods API test

on:
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search Royal Kuchen in test store
        run: |
          API_URL='https://magnit.ru''/webgate/v2/goods/search'

          curl --compressed -sS --max-time 30 \
            -X POST \
            "$API_URL" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Origin: https://magnit.ru' \
            -H 'Referer: https://magnit.ru/' \
            -d '{
              "term": "Royal Kuchen",
              "pagination": {
                "limit": 50,
                "offset": 0
              },
              "sort": {
                "order": "desc",
                "type": "popularity"
              },
              "includeAdultGoods": true,
              "storeCode": "233462",
              "storeType": "1",
              "catalogType": "1"
            }' \
            -w '\nHTTP_STATUS:%{http_code}\n'
            
