
name: Deploy Magnit Parser

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "geo.js"
      - "api.js"
      - "app.js"
      - "stores.json"
      - "results.json"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magnit-goods-search
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preserve previous search results
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail

          RESULTS_URL="${PAGES_URL%/}/results.json"

          echo "Загружаем прежние результаты: $RESULTS_URL"

          curl -fLsS \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            "$RESULTS_URL" \
            -o results.json

          echo "Прежний results.json сохранён"

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp geo.js _site/
          cp api.js _site/
          cp app.js _site/
          cp stores.json _site/
          cp results.json _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
