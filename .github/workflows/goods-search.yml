name: Search Magnit goods

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: magnit-goods-search
  cancel-in-progress: false

jobs:
  search:
    if: >-
      github.event.issue.user.login == 'hectepob' &&
      startsWith(github.event.issue.title, '[MAGNIT-SEARCH]')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Search goods in selected stores
        env:
          ISSUE_BODY_JSON: ${{ toJSON(github.event.issue.body) }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          # Получаем параметры из тела Issue
          body = json.loads(os.environ["ISSUE_BODY_JSON"])

          match = re.search(
              r"<!-- MAGNIT_SEARCH_REQUEST\s*(\{.*?\})\s*-->",
              body,
              re.DOTALL
          )

          if not match:
              print("::error::Не найден блок параметров поиска")
              sys.exit(1)

          try:
              request = json.loads(match.group(1))
          except json.JSONDecodeError:
              print("::error::Некорректный JSON параметров")
              sys.exit(1)

          request_id = request.get("requestId")
          brand = request.get("brand")
          requested_stores = request.get("stores")

          if not isinstance(request_id, str) or not re.fullmatch(
              r"[A-Za-z0-9-]{10,80}", request_id
          ):
              print("::error::Некорректный идентификатор запроса")
              sys.exit(1)

          if not isinstance(brand, str) or not brand.strip() or len(brand) > 80:
              print("::error::Некорректное название бренда")
              sys.exit(1)

          if not isinstance(requested_stores, list) or not (
              1 <= len(requested_stores) <= 100
          ):
              print("::error::Количество магазинов должно быть от 1 до 100")
              sys.exit(1)

          # Загружаем известные магазины и проверяем коды
          with open("stores.json", encoding="utf-8") as f:
              stores_data = json.load(f)

          known_stores = {
              str(store["storeCode"]): store
              for store in stores_data["stores"]
          }

          selected_stores = []
          seen_codes = set()

          for item in requested_stores:
              code = str(item.get("storeCode", ""))

              if not re.fullmatch(r"[0-9]{1,12}", code):
                  continue

              if code in seen_codes or code not in known_stores:
                  continue

              seen_codes.add(code)
              selected_stores.append(known_stores[code])

          if not selected_stores:
              print("::error::Не найдено подходящих магазинов")
              sys.exit(1)

          # Запросы к API Магнита
          api_url = "https://magnit.ru/webgate/v2/goods/search"

          results = []

          for index, store in enumerate(selected_stores, start=1):
              code = str(store["storeCode"])

              print(
                  f"[{index}/{len(selected_stores)}] "
                  f"Магазин {code}: {store['address']}"
              )

              request_body = {
                  "term": brand.strip(),
                  "pagination": {
                      "limit": 50,
                      "offset": 0
                  },
                  "sort": {
                      "order": "desc",
                      "type": "popularity"
                  },
                  "includeAdultGoods": True,
                  "storeCode": code,
                  "storeType": "1",
                  "catalogType": "1"
              }

              try:
                  encoded_body = json.dumps(
                      request_body,
                      ensure_ascii=False
                  ).encode("utf-8")

                  req = urllib.request.Request(
                      api_url,
                      data=encoded_body,
                      headers={
                          "Content-Type": "application/json",
                          "Accept": "application/json",
                          "Origin": "https://magnit.ru",
                          "Referer": "https://magnit.ru/"
                      },
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=35) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"HTTP {response.status}"
                          )
                      
                      raw_data = response.read()

                  # Распаковываем gzip, если сервер вернул сжатый ответ
                  if raw_data.startswith(b"\x1f\x8b"):
                      raw_data = gzip.decompress(raw_data)

                  data = json.loads(
                      raw_data.decode("utf-8-sig")
                  )
                  
                  items = data.get("items")

                  if not isinstance(items, list):
                      raise RuntimeError(
                          "В ответе API отсутствует массив items"
                      )

                  results.append({
                      "store": {
                          "storeCode": code,
                          "address": store["address"],
                          "format": store.get("format", "")
                      },
                      "items": items,
                      "error": None
                  })

                  print(f"Найдено товаров: {len(items)}")

              except Exception as error:
                  message = f"{type(error).__name__}: {error}"

                  print(f"Ошибка: {message}")

                  results.append({
                      "store": {
                          "storeCode": code,
                          "address": store["address"],
                          "format": store.get("format", "")
                      },
                      "items": [],
                      "error": message
                  })

          # Сохраняем результат
          output = {
              "requestId": request_id,
              "issueNumber": int(os.environ["ISSUE_NUMBER"]),
              "brand": brand.strip(),
              "updatedAt": datetime.now(timezone.utc).isoformat(
                  timespec="seconds"
              ).replace("+00:00", "Z"),
              "stores": results
          }

          with open("results.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          successful = sum(
              1 for item in results if item["error"] is None
          )

          total_goods = sum(
              len(item["items"]) for item in results
          )

          print("")
          print("========== РЕЗУЛЬТАТ ==========")
          print(f"Бренд: {brand}")
          print(f"Магазинов: {len(results)}")
          print(f"Успешно обработано: {successful}")
          print(f"Найдено товаров: {total_goods}")
          print("Результаты сохранены в results.json")
          PY

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp geo.js _site/
          cp api.js _site/
          cp app.js _site/
          cp stores.json _site/
          cp results.json _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Close search issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Поиск завершён. Результаты опубликованы на сайте."

      - name: Delete old search issues
        env:
          GH_TOKEN: ${{ secrets.ISSUE_DELETE_TOKEN }}
        run: |
          set -euo pipefail

          QUERY='
          query($owner: String!, $name: String!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              issues(
                first: 100
                after: $cursor
                states: CLOSED
                orderBy: {
                  field: CREATED_AT
                  direction: DESC
                }
              ) {
                pageInfo {
                  hasNextPage
                  endCursor
                }
                nodes {
                  id
                  title
                  author {
                    login
                  }
                }
              }
            }
          }'

          : > search-issues.jsonl

          CURSOR=""
          HAS_NEXT="true"

          while [ "$HAS_NEXT" = "true" ]; do
            PAYLOAD=$(jq -n \
              --arg query "$QUERY" \
              --arg cursor "$CURSOR" \
              '{
                query: $query,
                variables: {
                  owner: "hectepob",
                  name: "magnit_parser",
                  cursor: (
                    if $cursor == "" then null else $cursor end
                  )
                }
              }')

            RESPONSE=$(printf '%s' "$PAYLOAD" | gh api graphql --input -)

            echo "$RESPONSE" | jq -e '.data.repository.issues.nodes' > /dev/null

            echo "$RESPONSE" | jq -c '
              .data.repository.issues.nodes[]
              | select(.title | startswith("[MAGNIT-SEARCH]"))
              | select(.author.login == "hectepob")
            ' >> search-issues.jsonl

            HAS_NEXT=$(echo "$RESPONSE" | jq -r \
              '.data.repository.issues.pageInfo.hasNextPage')

            CURSOR=$(echo "$RESPONSE" | jq -r \
              '.data.repository.issues.pageInfo.endCursor // ""')
          done

          mapfile -t ISSUE_IDS < <(
            jq -s -r '.[].id' search-issues.jsonl
          )

          ISSUE_COUNT=${#ISSUE_IDS[@]}

          echo "Найдено закрытых поисковых Issues: $ISSUE_COUNT"

          if [ "$ISSUE_COUNT" -le 2 ]; then
            echo "Удаление не требуется. Оставляем все Issues."
            exit 0
          fi

          echo "Оставляем два последних Issue."

          for ((i=2; i<ISSUE_COUNT; i++)); do
            ISSUE_ID="${ISSUE_IDS[$i]}"

            echo "Удаляем старый Issue: $ISSUE_ID"

            DELETE_RESPONSE=$(gh api graphql \
              -f query='
                mutation($id: ID!) {
                  deleteIssue(input: {issueId: $id}) {
                    clientMutationId
                    repository {
                      name
                    }
                  }
                }
              ' \
              -F id="$ISSUE_ID")

            echo "$DELETE_RESPONSE" | jq -e \
              '.data.deleteIssue.repository.name == "magnit_parser"' \
              > /dev/null

            echo "Issue удалён."
          done

          echo "Очистка завершена."
