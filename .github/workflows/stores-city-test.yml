
name: Magnit stores city test

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Город для поиска'
        required: true
        default: 'Сочи'
        type: string

jobs:
  stores-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search stores by city
        env:
          CITY: ${{ inputs.city }}
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"filters":{"query":os.environ["CITY"]},"pagination":{"size":500}}, ensure_ascii=False))')

          echo "Город поиска: $CITY"
          echo "Размер страницы: 500"

          HTTP_STATUS=$(curl --compressed -sS --max-time 60 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d "$BODY" \
            -o response.json \
            -w '%{http_code}')

          echo "HTTP STATUS: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            cat response.json
            echo "::error::API вернул HTTP $HTTP_STATUS"
            exit 1
          fi

          python3 - <<'PY'
          import json
from collections import Counter, defaultdict

with open("response.json", encoding="utf-8") as f:
    result = json.load(f)

data = result.get("data", [])

print("\n========== ОБЩАЯ ИНФОРМАЦИЯ ==========")
print("Всего по версии API:", result.get("totalCount"))
print("Фактически получено:", len(data))

print("\n========== РАСПРЕДЕЛЕНИЕ ПО OWNER ==========")
owners = Counter(
    s.get("externalId", {}).get("owner")
    for s in data
)
for owner, count in owners.most_common():
    print(f"{owner}: {count}")

print("\n========== РАСПРЕДЕЛЕНИЕ ПО ФОРМАТАМ ==========")
formats = Counter(s.get("storeTypeV2") for s in data)
for fmt, count in formats.most_common():
    print(f"{fmt}: {count}")

print("\n========== CITYFIASID И ПРИМЕРЫ АДРЕСОВ ==========")

cities = defaultdict(list)

for s in data:
    city_id = s.get("cityFiasId")
    cities[city_id].append(s)

for city_id, stores in sorted(
    cities.items(),
    key=lambda x: len(x[1]),
    reverse=True
):
    print(f"\nCITYFIASID: {city_id}")
    print("Количество записей:", len(stores))

    for s in stores[:5]:
        owner = s.get("externalId", {}).get("owner")
        code = s.get("externalId", {}).get("storeCode")
        print(
            f"  {s.get('address')} | "
            f"{s.get('storeTypeV2')} | "
            f"{owner} | {code}"
        )

print("\n========== СОЧИ: ТОЛЬКО OWNER_MAGNIT ==========")

sochi_magnit = [
    s for s in data
    if "сочи" in str(s.get("address", "")).lower()
    and s.get("externalId", {}).get("owner") == "OWNER_MAGNIT"
]

print("Количество:", len(sochi_magnit))

for i, s in enumerate(sochi_magnit, 1):
    print(
        f"{i}. {s.get('address')} | "
        f"{s.get('storeTypeV2')} | "
        f"{s.get('externalId', {}).get('storeCode')} | "
        f"{s.get('cityFiasId')}"
    )
          PY
          
