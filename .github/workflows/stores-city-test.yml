
name: Magnit stores city test

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Город для поиска'
        required: true
        default: 'Сочи'
        type: string

jobs:
  stores-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search stores by city
        env:
          CITY: ${{ inputs.city }}
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"filters":{"query":os.environ["CITY"]},"pagination":{"size":10}}, ensure_ascii=False))')

          echo "Город поиска: $CITY"
          echo "Тело запроса: $BODY"
          echo ""

          HTTP_STATUS=$(curl --compressed -sS --max-time 30 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d "$BODY" \
            -o response.json \
            -w '%{http_code}')

          echo "HTTP STATUS: $HTTP_STATUS"
          echo ""

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              result = json.load(f)

          print("КЛЮЧИ ОТВЕТА:")
          print(list(result.keys()))

          print("\nОБЩИЕ СВЕДЕНИЯ:")
          print(json.dumps(
              {k: v for k, v in result.items() if k != "data"},
              ensure_ascii=False,
              indent=2
          ))

          data = result.get("data", [])

          print("\nКОЛИЧЕСТВО ПОЛУЧЕННЫХ ЗАПИСЕЙ:", len(data))
          print("ОБЩЕЕ КОЛИЧЕСТВО (totalCount):", result.get("totalCount"))

          if data:
              print("\nПОЛЯ ПЕРВОЙ ЗАПИСИ:")
              print(list(data[0].keys()))

          print("\nСПИСОК МАГАЗИНОВ:")
          for i, store in enumerate(data, 1):
              print(f"{i}. {store.get('address', 'АДРЕС НЕ НАЙДЕН')}")
              print(f"   Формат: {store.get('storeTypeV2', 'НЕИЗВЕСТЕН')}")
              print(f"   Код: {store.get('storeCode', 'НЕИЗВЕСТЕН')}")
              print()
          PY

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::API вернул HTTP $HTTP_STATUS"
            exit 1
          fi
          
