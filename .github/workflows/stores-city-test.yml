
name: Magnit stores city test

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Город для поиска'
        required: true
        default: 'Сочи'
        type: string

jobs:
  stores-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check store coordinates
        env:
          CITY: ${{ inputs.city }}
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"filters":{"query":os.environ["CITY"]},"pagination":{"size":500}}, ensure_ascii=False))')

          echo "Город поиска: $CITY"

          HTTP_STATUS=$(curl --compressed -sS --max-time 60 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d "$BODY" \
            -o response.json \
            -w '%{http_code}')

          echo "HTTP STATUS: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            cat response.json
            echo "::error::API вернул HTTP $HTTP_STATUS"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from collections import Counter

          with open("response.json", encoding="utf-8") as f:
              result = json.load(f)

          data = result.get("data", [])

          stores = [
              s for s in data
              if s.get("externalId", {}).get("owner") == "OWNER_MAGNIT"
          ]

          valid = []
          missing = []
          invalid = []

          for s in stores:
              coords = s.get("coordinates")

              if not isinstance(coords, dict):
                  missing.append(s)
                  continue

              lat = coords.get("latitude")
              lon = coords.get("longitude")

              if lat is None or lon is None:
                  missing.append(s)
                  continue

              try:
                  lat = float(lat)
                  lon = float(lon)
              except (TypeError, ValueError):
                  invalid.append(s)
                  continue

              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  invalid.append(s)
                  continue

              valid.append(s)

          print("\n========== РЕЗУЛЬТАТ ==========")
          print(f"Всего записей API: {len(data)}")
          print(f"Магазинов OWNER_MAGNIT: {len(stores)}")
          print(f"Корректные координаты: {len(valid)}")
          print(f"Координаты отсутствуют: {len(missing)}")
          print(f"Координаты некорректны: {len(invalid)}")

          problems = missing + invalid

          if problems:
              print("\n========== ПРИМЕРЫ ПРОБЛЕМ ==========")

              for s in problems[:10]:
                  ext = s.get("externalId", {})
                  print(
                      f"{s.get('address')} | "
                      f"{s.get('storeTypeV2')} | "
                      f"{ext.get('storeCode')} | "
                      f"{s.get('coordinates')}"
                  )

          print("\n========== ФОРМАТЫ МАГАЗИНОВ ==========")
          formats = Counter(s.get("storeTypeV2") for s in stores)

          for fmt, count in formats.most_common():
              print(f"{fmt}: {count}")
          PY
          
