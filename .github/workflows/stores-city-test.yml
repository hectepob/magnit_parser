
name: Magnit stores city test

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Город для поиска'
        required: true
        default: 'Сочи'
        type: string

jobs:
  stores-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search stores by city
        env:
          CITY: ${{ inputs.city }}
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"filters":{"query":os.environ["CITY"]},"pagination":{"size":500}}, ensure_ascii=False))')

          echo "Город поиска: $CITY"
          echo "Размер страницы: 500"

          HTTP_STATUS=$(curl --compressed -sS --max-time 60 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d "$BODY" \
            -o response.json \
            -w '%{http_code}')

          echo "HTTP STATUS: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            cat response.json
            echo "::error::API вернул HTTP $HTTP_STATUS"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from collections import Counter

          with open("response.json", encoding="utf-8") as f:
              result = json.load(f)

          data = result.get("data", [])

          print("\n========== ОБЩАЯ ИНФОРМАЦИЯ ==========")
          print("Всего по версии API:", result.get("totalCount"))
          print("Фактически получено:", len(data))

          print("\n========== СТРУКТУРА ПЕРВОГО МАГАЗИНА ==========")
          if data:
              print(json.dumps(data[0], ensure_ascii=False, indent=2))

          print("\n========== ГОРОДА / CITY FIAS ID ==========")
          city_ids = Counter(
              str(s.get("cityFiasId"))
              for s in data
          )
          for city_id, count in city_ids.most_common():
              print(f"{city_id}: {count}")

          print("\n========== ЗАПИСИ С СОЧИ В АДРЕСЕ ==========")
          sochi = [
              s for s in data
              if "сочи" in str(s.get("address", "")).lower()
          ]

          print("Количество:", len(sochi))

          for i, s in enumerate(sochi, 1):
              print(f"\n{i}. {s.get('address')}")
              print("Формат:", s.get("storeTypeV2"))
              print("Тип:", s.get("storeType"))
              print("Активен:", s.get("isActive"))
              print("Координаты:", s.get("coordinates"))
              print("External ID:", s.get("externalId"))
          PY
          
