name: Magnit stores city test

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Город для поиска'
        required: true
        default: 'Сочи'
        type: string

jobs:
  stores-test:
    runs-on: ubuntu-latest

    steps:
      - name: Search stores by city
        env:
          CITY: ${{ inputs.city }}
        run: |
          BODY=$(python3 -c 'import json,os; print(json.dumps({"filters":{"query":os.environ["CITY"]},"pagination":{"size":500}}, ensure_ascii=False))')

          echo "Город поиска: $CITY"
          echo "Размер страницы: 500"

          HTTP_STATUS=$(curl --compressed -sS --max-time 60 \
            -X POST \
            'https://magnit.ru/webgate/v1/stores-facade/search/detail' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Referer: https://magnit.ru/' \
            -d "$BODY" \
            -o response.json \
            -w '%{http_code}')

          echo "HTTP STATUS: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            cat response.json
            echo "::error::API вернул HTTP $HTTP_STATUS"
            exit 1
          fi

          python3 - <<'PY'
import json

with open("response.json", encoding="utf-8") as f:
    result = json.load(f)

stores = [
    s for s in result.get("data", [])
    if s.get("externalId", {}).get("owner") == "OWNER_MAGNIT"
]

valid = []
problems = []

for s in stores:
    coords = s.get("coordinates") or {}
    lat = coords.get("latitude")
    lon = coords.get("longitude")

    try:
        lat = float(lat)
        lon = float(lon)

        if not (-90 <= lat <= 90 and -180 <= lon <= 180):
            raise ValueError("Координаты вне допустимого диапазона")

        valid.append(s)

    except (TypeError, ValueError):
        problems.append(s)

print("\n========== ПРОВЕРКА КООРДИНАТ ==========")
print("Магазинов OWNER_MAGNIT:", len(stores))
print("Корректные координаты:", len(valid))
print("Проблемные записи:", len(problems))

if problems:
    print("\nПримеры проблемных записей:")
    for s in problems[:5]:
        print(
            f"{s.get('address')} | "
            f"{s.get('externalId', {}).get('storeCode')} | "
            f"{s.get('coordinates')}"
        )
PY
